name: Verify source, API and SEO
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: pip install -e './apps/api[test]'
      - name: Run API tests
        run: pytest -q apps/api/tests
      - name: Run SEO and business-logic tests
        run: |
          python -m unittest discover -s tests -v
          python scripts/build_site.py --preview
          python scripts/check_seo.py site/dist
